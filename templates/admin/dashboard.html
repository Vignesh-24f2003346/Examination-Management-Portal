{% extends 'base.html' %}
{% block content %}
<h3>Admin Dashboard</h3>
{% if pending %}<div class="alert alert-warning">{{ pending }} examiner(s) are waiting for your approval. <a href="{{ url_for('admin_examiners') }}">Review</a></div>{% endif %}

<div class="row g-3">
{% for label, n, ep in stats %}
  <div class="col-6 col-md-4"><a class="stat" href="{{ url_for(ep) }}"><div class="card text-center"><div class="card-body">
    <div class="n">{{ n }}</div><div class="text-muted">{{ label }}</div>
  </div></div></a></div>
{% endfor %}
</div>
{% endblock %}
