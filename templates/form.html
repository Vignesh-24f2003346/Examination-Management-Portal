{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-8 col-lg-6">
<div class="card shadow-sm"><div class="card-body">
<h4 class="mb-1">{{ title }}</h4>
<div class="mb-3"></div>
<form method="post">
{% for f in fields %}
<div class="mb-3">
  <label class="form-label">{{ f.label }}</label>
  {% if f.type == 'select' %}
  <select name="{{ f.name }}" class="form-select" {{ 'required' if f.req }}>
    {% for v, l in f.options %}<option value="{{ v }}" {{ 'selected' if v|string == f.value|string }}>{{ l }}</option>{% endfor %}
  </select>
  {% elif f.type == 'textarea' %}
  <textarea name="{{ f.name }}" class="form-control" rows="3">{{ f.value }}</textarea>
  {% else %}
  <input type="{{ f.type }}" name="{{ f.name }}" value="{{ f.value }}" class="form-control" {{ 'required' if f.req }} {% if f.type == 'number' %}step="any" min="0"{% endif %}>
  {% endif %}
</div>
{% endfor %}
<button class="btn btn-primary">{{ submit }}</button>
<a href="{{ back }}" class="btn btn-secondary">{{ back_label }}</a>
</form>
</div></div></div></div>
{% endblock %}
